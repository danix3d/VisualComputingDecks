<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="800" viewBox="0 0 1800 800"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 z" fill="#000"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L10,5 L0,9 z" fill="#000"/></marker></defs><rect x="920.0" y="652.0" width="590.0" height="140.0" rx="10" fill="#F7ECE6" stroke="none" stroke-width="0"/><text x="1215.0" y="686.0" font-family="'Gill Sans','Gill Sans MT',Calibri,'Trebuchet MS',sans-serif" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#000">The depth <tspan font-family="'Times New Roman',Times,serif" font-style="italic">z</tspan> is kept all the way:</text><text x="1215.0" y="724.0" font-family="'Gill Sans','Gill Sans MT',Calibri,'Trebuchet MS',sans-serif" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#000">it still orders the points along each ray,</text><text x="1215.0" y="762.0" font-family="'Gill Sans','Gill Sans MT',Calibri,'Trebuchet MS',sans-serif" font-size="28" text-anchor="middle" dominant-baseline="central" fill="#000">and the z-buffer uses it for visibility</text><line x1="1368.0" y1="648.0" x2="1368.0" y2="624.2" stroke="#5A6E8C" stroke-width="2.5" stroke-linecap="butt"/><polygon points="1368.0,608.0 1375.5,626.0 1360.5,626.0" fill="#5A6E8C" stroke="#5A6E8C" stroke-width="1" stroke-linejoin="miter"/></svg>